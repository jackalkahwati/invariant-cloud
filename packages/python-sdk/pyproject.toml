[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant-sdk"
version = "0.1.0"
description = "Python SDK for the Invariant coherence engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["invariant", "coherence", "agent", "sdk"]
authors = [
  { name = "Invariant", email = "dev@invariant.me" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.urls]
Homepage = "https://invariant.me"
Repository = "https://github.com/invariant-me/coherence-engine"
Documentation = "https://docs.invariant.me"

[tool.hatch.build.targets.wheel]
packages = ["invariant"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
