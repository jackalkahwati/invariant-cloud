<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Invariant | Sign in</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#adc6ff",
          "on-secondary": "#472a00",
          "on-tertiary-container": "#00311f",
          "tertiary-fixed": "#6ffbbe",
          "on-error": "#690005",
          "surface-container": "#171f33",
          "secondary-container": "#ee9800",
          "on-secondary-fixed": "#2a1700",
          "on-tertiary-fixed": "#002113",
          "on-error-container": "#ffdad6",
          "primary-fixed": "#d8e2ff",
          "inverse-on-surface": "#283044",
          "on-tertiary-fixed-variant": "#005236",
          "on-surface-variant": "#c2c6d6",
          "secondary": "#ffb95f",
          "on-surface": "#dae2fd",
          "surface-bright": "#31394d",
          "on-primary": "#002e6a",
          "inverse-surface": "#dae2fd",
          "on-secondary-fixed-variant": "#653e00",
          "surface-container-highest": "#2d3449",
          "inverse-primary": "#005ac2",
          "tertiary-container": "#00a572",
          "surface-variant": "#2d3449",
          "on-background": "#dae2fd",
          "on-secondary-container": "#5b3800",
          "outline": "#8c909f",
          "surface": "#0b1326",
          "on-primary-container": "#00285d",
          "primary-container": "#4d8eff",
          "on-tertiary": "#003824",
          "error-container": "#93000a",
          "outline-variant": "#424754",
          "surface-dim": "#0b1326",
          "on-primary-fixed": "#001a42",
          "on-primary-fixed-variant": "#004395",
          "tertiary-fixed-dim": "#4edea3",
          "surface-container-low": "#131b2e",
          "tertiary": "#4edea3",
          "error": "#ffb4ab",
          "secondary-fixed-dim": "#ffb95f",
          "surface-container-lowest": "#060e20",
          "secondary-fixed": "#ffddb8",
          "surface-container-high": "#222a3d",
          "surface-tint": "#adc6ff",
          "background": "#0b1326",
          "primary-fixed-dim": "#adc6ff"
        },
        fontFamily: {
          "headline": ["Space Grotesk"],
          "body": ["Inter"],
          "label": ["Inter"],
          "mono": ["JetBrains Mono"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
      },
    },
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .cta-primary {
    background: linear-gradient(135deg, #adc6ff 0%, #4d8eff 100%);
  }
  .node-link-bg {
    background-image: radial-gradient(#424754 1px, transparent 1px);
    background-size: 32px 32px;
  }
</style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">

<!-- Top nav -->
<nav class="fixed top-0 z-50 flex justify-between items-center w-full px-6 h-16 bg-[#0b1326] border-b border-outline-variant/10">
  <a href="index.html" class="text-xl font-bold text-[#dae2fd] tracking-tighter font-['Space_Grotesk'] hover:text-primary transition-colors">Invariant</a>
  <div class="flex items-center gap-3">
    <a href="login.html" class="text-sm text-outline hover:text-primary transition-colors">Sign in</a>
    <a href="register.html" class="bg-gradient-to-br from-primary to-primary-container text-on-primary-container text-xs px-3 py-1.5 rounded font-bold">Sign up</a>
  </div>
</nav>

<!-- Background -->
<div class="absolute inset-0 node-link-bg opacity-10 pointer-events-none"></div>
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-primary/6 blur-[100px] rounded-full pointer-events-none"></div>

<!-- Main centered card -->
<main class="relative z-10 flex-1 flex items-center justify-center px-4 pt-16">
  <div class="w-full max-w-md">
    <div class="bg-surface-container-low rounded-xl p-8 border border-outline-variant/20 shadow-2xl">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="font-['Space_Grotesk'] text-2xl font-bold text-on-surface tracking-tight mb-1">Welcome back</h1>
        <p class="text-sm text-outline">Sign in to your Invariant workspace</p>
      </div>

      <!-- Error message -->
      <div id="error-msg" class="hidden mb-4 px-4 py-3 bg-error-container/20 border border-error/30 rounded-lg text-error text-sm"></div>

      <!-- Form -->
      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-1.5" for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="ada@lab.ai"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-lg px-4 py-2.5 text-sm text-on-surface placeholder:text-outline/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-1.5" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-lg px-4 py-2.5 text-sm text-on-surface placeholder:text-outline/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all"
          />
        </div>

        <button
          id="submit-btn"
          type="submit"
          class="w-full mt-2 py-2.5 px-4 cta-primary text-on-primary font-bold text-sm rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
        >
          <span id="submit-text">Sign in →</span>
          <span id="submit-spinner" class="hidden material-symbols-outlined text-sm animate-spin">refresh</span>
        </button>
      </form>

      <!-- Footer links -->
      <div class="mt-6 pt-6 border-t border-outline-variant/15 text-center">
        <p class="text-sm text-outline">
          Don't have an account?
          <a href="register.html" class="text-primary hover:underline font-medium">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</main>

<script>
const API_BASE = 'http://localhost:3000';

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('submit-text');
  const spinner = document.getElementById('submit-spinner');
  const errMsg = document.getElementById('error-msg');

  btn.disabled = true;
  btnText.textContent = 'Signing in…';
  spinner.classList.remove('hidden');
  errMsg.classList.add('hidden');

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      errMsg.textContent = data.error || 'Login failed. Please check your credentials.';
      errMsg.classList.remove('hidden');
      btn.disabled = false;
      btnText.textContent = 'Sign in →';
      spinner.classList.add('hidden');
      return;
    }

    localStorage.setItem('inv_token', data.token);
    if (data.workspace) {
      localStorage.setItem('inv_workspace', JSON.stringify(data.workspace));
    }
    window.location.href = 'account.html';

  } catch (err) {
    errMsg.textContent = 'Could not reach the API. Make sure the server is running on localhost:3000.';
    errMsg.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Sign in →';
    spinner.classList.add('hidden');
  }
}
</script>
</body>
</html>
