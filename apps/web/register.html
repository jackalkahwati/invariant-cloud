<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .cta-primary {
    background: linear-gradient(135deg, #adc6ff 0%, #4d8eff 100%);
  }
  .node-link-bg {
    background-image: radial-gradient(#424754 1px, transparent 1px);
    background-size: 32px 32px;
  }
</style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">

<!-- Top nav -->
<nav class="fixed top-0 z-50 flex justify-between items-center w-full px-6 h-16 bg-[#0b1326] font-['Space_Grotesk'] tracking-tight border-b border-outline-variant/10">
  <div class="flex items-center gap-8">
    <a href="index.html" class="text-xl font-bold text-[#dae2fd] tracking-tighter hover:text-primary transition-colors">Invariant</a>
    <div class="hidden md:flex gap-6">
      <a class="text-[#94a3b8] hover:text-[#adc6ff] transition-colors h-16 flex items-center" href="index.html">Home</a>
      <a class="text-[#94a3b8] hover:text-[#adc6ff] transition-colors h-16 flex items-center" href="docs.html">Docs</a>
      <a class="text-[#94a3b8] hover:text-[#adc6ff] transition-colors h-16 flex items-center" href="pricing.html">Pricing</a>
      <a class="text-[#94a3b8] hover:text-[#adc6ff] transition-colors h-16 flex items-center" href="https://github.com/jackalkahwati/invariant-cloud" target="_blank">GitHub</a>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <a href="login.html" class="text-sm text-[#94a3b8] hover:text-[#adc6ff] transition-colors">Sign in</a>
  </div>
</nav>

<!-- Background -->
<div class="absolute inset-0 node-link-bg opacity-10 pointer-events-none"></div>
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-primary/6 blur-[100px] rounded-full pointer-events-none"></div>

<!-- Main centered card -->
<main class="relative z-10 flex-1 flex items-center justify-center px-4 pt-16">
  <div class="w-full max-w-md">
    <div class="bg-surface-container-low rounded-xl p-8 border border-outline-variant/20 shadow-2xl">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="font-['Space_Grotesk'] text-2xl font-bold text-on-surface tracking-tight mb-1">Create your workspace</h1>
        <p class="text-sm text-outline">Free forever. No credit card required.</p>
      </div>

      <!-- GitHub OAuth -->
      <a
        href="#" id="github-oauth-btn"
        class="flex items-center justify-center gap-3 w-full py-2.5 px-4 bg-surface-container-high border border-outline-variant/30 rounded-lg text-on-surface text-sm font-semibold hover:bg-surface-variant transition-colors mb-6"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12"/></svg>
        Continue with GitHub
      </a>

      <!-- Divider -->
      <div class="flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-outline-variant/20"></div>
        <span class="text-xs text-outline font-mono uppercase tracking-wider">or</span>
        <div class="flex-1 h-px bg-outline-variant/20"></div>
      </div>

      <!-- Error message -->
      <div id="error-msg" class="hidden mb-4 px-4 py-3 bg-error-container/20 border border-error/30 rounded-lg text-error text-sm"></div>

      <!-- Form -->
      <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-1.5" for="name">Name <span class="text-outline/50">(optional)</span></label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="Ada Lovelace"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-lg px-4 py-2.5 text-sm text-on-surface placeholder:text-outline/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-1.5" for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="ada@lab.ai"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-lg px-4 py-2.5 text-sm text-on-surface placeholder:text-outline/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-1.5" for="password">Password <span class="text-outline/50">(min 8 chars)</span></label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="••••••••"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-lg px-4 py-2.5 text-sm text-on-surface placeholder:text-outline/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-1.5" for="workspace">Workspace name <span class="text-outline/50">(optional)</span></label>
          <input
            id="workspace"
            name="workspace"
            type="text"
            placeholder="My Workspace"
            class="w-full bg-surface-container border border-outline-variant/30 rounded-lg px-4 py-2.5 text-sm text-on-surface placeholder:text-outline/40 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary/40 transition-all"
          />
        </div>

        <button
          id="submit-btn"
          type="submit"
          class="w-full mt-2 py-2.5 px-4 cta-primary text-on-primary font-bold text-sm rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
        >
          <span id="submit-text">Create account →</span>
          <span id="submit-spinner" class="hidden material-symbols-outlined text-sm animate-spin">refresh</span>
        </button>
      </form>

      <!-- Footer links -->
      <div class="mt-6 pt-6 border-t border-outline-variant/15 text-center space-y-2">
        <p class="text-sm text-outline">
          Already have an account?
          <a href="login.html" class="text-primary hover:underline font-medium">Sign in</a>
        </p>
        <p class="text-xs text-outline/50">By signing up you agree to our <a href="terms.html" class="text-primary/80 hover:text-primary hover:underline">Terms of Service</a> and <a href="privacy.html" class="text-primary/80 hover:text-primary hover:underline">Privacy Policy</a>.</p>
      </div>
    </div>
  </div>
</main>

<!-- API Key reveal modal -->
<div id="apikey-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm px-4">
  <div class="w-full max-w-lg bg-surface-container-low rounded-xl p-8 border border-primary/30 shadow-2xl">
    <div class="flex items-center gap-3 mb-4">
      <span class="material-symbols-outlined text-tertiary text-2xl">key</span>
      <h2 class="font-['Space_Grotesk'] text-xl font-bold text-on-surface">Your API Key</h2>
    </div>
    <div class="bg-surface-container-lowest rounded-lg p-4 mb-4 border border-outline-variant/20">
      <p class="text-xs font-mono text-outline uppercase tracking-wider mb-2">Save this, it won't be shown again</p>
      <code id="apikey-display" class="font-mono text-sm text-primary break-all block"></code>
    </div>
    <button
      onclick="copyApiKey()"
      id="copy-btn"
      class="w-full mb-4 py-2.5 px-4 bg-surface-container-high border border-outline-variant/30 text-on-surface font-bold text-sm rounded-lg hover:bg-surface-variant transition-colors flex items-center justify-center gap-2"
    >
      <span class="material-symbols-outlined text-sm">content_copy</span>
      <span id="copy-text">Copy API Key</span>
    </button>
    <button
      onclick="dismissModal()"
      class="w-full py-2.5 px-4 cta-primary text-on-primary font-bold text-sm rounded-lg hover:opacity-90 transition-opacity"
    >
      Continue to account →
    </button>
  </div>
</div>

<script src="api-base.js"></script>
<script>
const API_BASE = window.INVARIANT_API_BASE;
const githubBtn = document.getElementById('github-oauth-btn');
if (window.invariantDesktop) {
  githubBtn.removeAttribute('href');
  githubBtn.style.cursor = 'pointer';
  githubBtn.addEventListener('click', () => {
    githubBtn.style.opacity = '0.6';
    window.invariantDesktop.startGitHubOAuth();
    window.invariantDesktop.onOAuthToken(({ token, apiKey }) => {
      if (token) {
        localStorage.setItem('inv_token', token);
        if (apiKey) localStorage.setItem('inv_api_key', apiKey);
        window.location.href = 'account.html';
      } else {
        githubBtn.style.opacity = '';
        document.getElementById('error-msg').textContent = 'GitHub sign-in failed. Please try again.';
        document.getElementById('error-msg').classList.remove('hidden');
      }
    });
  });
} else {
  githubBtn.href = API_BASE + '/auth/github';
}
let pendingApiKey = '';

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('submit-text');
  const spinner = document.getElementById('submit-spinner');
  const errMsg = document.getElementById('error-msg');

  btn.disabled = true;
  btnText.textContent = 'Creating account…';
  spinner.classList.remove('hidden');
  errMsg.classList.add('hidden');

  const body = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
  };
  const name = document.getElementById('name').value.trim();
  const workspace = document.getElementById('workspace').value.trim();
  if (name) body.name = name;
  if (workspace) body.workspaceName = workspace;

  try {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok) {
      errMsg.textContent = data.error || 'Registration failed. Please try again.';
      errMsg.classList.remove('hidden');
      btn.disabled = false;
      btnText.textContent = 'Create account →';
      spinner.classList.add('hidden');
      return;
    }

    // Store JWT
    localStorage.setItem('inv_token', data.token);
    // Store workspace info
    if (data.workspace) {
      localStorage.setItem('inv_workspace', JSON.stringify(data.workspace));
    }

    // Show API key modal
    pendingApiKey = data.apiKey;
    document.getElementById('apikey-display').textContent = data.apiKey;
    document.getElementById('apikey-modal').classList.remove('hidden');

  } catch (err) {
    errMsg.textContent = 'Could not reach the server. Please try again or contact support.';
    errMsg.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Create account →';
    spinner.classList.add('hidden');
  }
}

async function copyApiKey() {
  try {
    await navigator.clipboard.writeText(pendingApiKey);
    const copyText = document.getElementById('copy-text');
    copyText.textContent = 'Copied!';
    setTimeout(() => { copyText.textContent = 'Copy API Key'; }, 2000);
  } catch {
    // fallback
    const el = document.getElementById('apikey-display');
    el.select && el.select();
  }
}

function dismissModal() {
  document.getElementById('apikey-modal').classList.add('hidden');
  window.location.href = 'account.html';
}
</script>
</body>
</html>
